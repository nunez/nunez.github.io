<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nunez</title>
<style>
  :root { --gold:#d9a441; --ink:#101416; --paper:#efe9dd; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:16px/1.7 Georgia, serif; background:var(--ink); color:var(--paper); }
  .wrap { max-width:520px; padding:48px 24px; text-align:center; }
  h1 { font-weight:600; letter-spacing:.18em; color:var(--gold); margin:0 0 8px; }
  p { color:#b9c2bd; }
  .dot { color:var(--gold); }
  footer { margin-top:3em; font-size:.8rem; color:#6d7a74; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NUNEZ</h1>
  <p>a quiet corner of the internet<span class="dot">.</span></p>
  <p>
    This domain hosts a few small personal projects — mostly homegrown
    software that runs on a machine under a roof, doing chores for the
    people who live there.
  </p>
  <footer>nunez<span class="dot">.</span>github.io</footer>
</div>
</body>
</html>
